<!DOCTYPE html>
<html>
<head>
    <title> Important HTML Tags</title>
</head>
<body>
    <h1>18. Important HTML Tags</h1>

    <table border="1" cellpadding="8">
        <tr>
            <th>Tag</th>
            <th>Purpose</th>
        </tr>
        <tr>
            <td>&lt;html&gt;</td>
            <td>Root element</td>
        </tr>
        <tr>
            <td>&lt;head&gt;</td>
            <td>Page information</td>
        </tr>
        <tr>
            <td>&lt;title&gt;</td>
            <td>Browser title</td>
        </tr>
        <tr>
            <td>&lt;body&gt;</td>
            <td>Visible content</td>
        </tr>
        <tr>
            <td>&lt;h1&gt; - &lt;h6&gt;</td>
            <td>Headings</td>
        </tr>
        <tr>
            <td>&lt;p&gt;</td>
            <td>Paragraph</td>
        </tr>
        <tr>
            <td>&lt;a&gt;</td>
            <td>Hyperlink</td>
        </tr>
        <tr>
            <td>&lt;img&gt;</td>
            <td>Image</td>
        </tr>
        <tr>
            <td>&lt;br&gt;</td>
            <td>Line break</td>
        </tr>
    </table>

</body>
</html>
